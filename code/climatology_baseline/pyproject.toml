[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["server_training_data", "train_swin_physics", "parallel_training.*", "dataset_v2.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["netCDF4.*", "torchvision.*"]
ignore_missing_imports = true
